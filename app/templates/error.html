<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="error-message">
            <div class="error-icon">
                <i class="fas fa-exclamation-circle"></i>
            </div>
            <h1>❌ Ошибка регистрации</h1>
            
            <div class="error-details">
                <p><strong>Сообщение:</strong> {{ error_message }}</p>
            </div>
            
            <div class="actions">
                <a href="/" class="btn btn-primary">
                    <i class="fas fa-arrow-left"></i> Вернуться к регистрации
                </a>
                <a href="/users" class="btn btn-info">
                    <i class="fas fa-users"></i> Посмотреть пользователей
                </a>
            </div>
            
            <div class="help-card">
                <h4><i class="fas fa-question-circle"></i> Возможные причины:</h4>
                <ul>
                    <li>Пользователь с таким логином уже существует</li>
                    <li>Логин или пароль слишком короткие (минимум 3 символа)</li>
                    <li>Проблемы с базой данных</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
